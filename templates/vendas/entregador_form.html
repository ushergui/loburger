{% extends "base.html" %}
{% block title %}{{ titulo }} - LOL BURGUER{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
    <div class="mb-6 flex items-center space-x-2">
        <a href="{% url 'entregador_listar' %}" class="text-hex_gold hover:text-white" title="Voltar"><i data-lucide="arrow-left" class="w-6 h-6"></i></a>
        <h1 class="text-2xl font-bold title-hex text-hex_gold">{{ titulo }}</h1>
    </div>
    <div class="bg-hex_dark_card border border-hex_dark_border p-6 md:p-8 rounded shadow-hex-gold">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="{{ form.nome.id_for_label }}" class="block text-xs uppercase tracking-wider text-hex_gold_light mb-2">Nome <span class="text-hex_blue">*</span></label>
                {{ form.nome }}
                {% if form.nome.errors %}<p class="text-red-400 text-xs mt-1">{{ form.nome.errors.0 }}</p>{% endif %}
            </div>
            <label class="flex items-center space-x-3 text-sm text-hex_gold_light">
                {{ form.eh_socio }}
                <span>É sócio (Igor / esposa) — entregas dele não geram custo de motoboy</span>
            </label>
            <label class="flex items-center space-x-3 text-sm text-hex_gold_light">
                {{ form.ativo }}
                <span>Ativo (aparece no fechamento diário)</span>
            </label>
            <div class="flex items-center justify-end space-x-4 pt-4 border-t border-hex_dark_border">
                <a href="{% url 'entregador_listar' %}" class="px-4 py-2.5 rounded text-xs font-semibold text-hex_gold hover:text-white uppercase tracking-wider">Cancelar</a>
                <button type="submit" class="bg-gradient-to-r from-hex_gold to-hex_gold_dim hover:from-hex_blue hover:to-hex_blue_dark text-hex_dark_bg hover:text-white font-bold py-2.5 px-6 rounded uppercase tracking-wider text-xs border border-hex_gold/40 shadow-hex-gold">Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
